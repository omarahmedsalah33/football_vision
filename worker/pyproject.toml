[project]
name = "fa-worker"
version = "0.1.0"
description = "Football Vision video analysis worker"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "boto3>=1.40",
  "av>=15",
  "numpy>=2",
  "pillow>=13",  # 12.x has known CVEs; frames come from untrusted uploads
]

[project.optional-dependencies]
dev = ["pytest>=8", "pip-audit>=2.7"]
# CPU overlay rendering; detector/tracker dependencies run only in the Modal GPU image.
tracking = ["opencv-python-headless>=4.12"]
# Computer vision. Install PyTorch for your platform first (CUDA build from download.pytorch.org),
# then `pip install -e ".[cv]"`. RF-DETR's standard sizes are Apache-2.0; the PML-licensed
# "rfdetr_plus" models are deliberately not used.
cv = ["rfdetr>=1.11,<2", "supervision>=0.29", "trackers>=2.6,<3", "scipy>=1.11", "opencv-python-headless>=4.12"]
# Accuracy evaluation on SoccerTrack v2 (streams multi-GB JSON).
eval = ["ijson>=3.3", "scipy>=1.11"]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fa_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
