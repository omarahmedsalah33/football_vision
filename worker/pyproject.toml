[project]
name = "fa-worker"
version = "0.1.0"
description = "Football Vision video analysis worker"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "boto3>=1.40",
  "av>=15",
  "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fa_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
