# Local development infrastructure only. Not a production deployment.
# Ports are bound to 127.0.0.1 so nothing is exposed to the local network.
name: footballanalyzer

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fa_dev
      POSTGRES_PASSWORD: fa_dev_password # dev only; never reuse outside this compose file
      POSTGRES_DB: footballanalyzer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fa_dev -d footballanalyzer"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development (SeaweedFS, Apache-2.0).
  # Production uses AWS S3 or Cloudflare R2 through the same S3 API.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    command: >
      mini -dir=/data -ip=objectstore -ip.bind=0.0.0.0
      -bucket=fa-videos-dev,fa-videos-test
      -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=http://localhost:3000
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objdata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  objdata:
