name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres and S3-compatible storage
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            [ "$(docker compose ps --format '{{.Health}}' postgres)" = "healthy" ] && break
            sleep 3
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Configure test environment
        working-directory: web
        run: cp .env.example .env
      - name: Typecheck, lint, test, build
        working-directory: web
        run: npm run check
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  worker:
    name: Worker (tests, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 40); do
            [ "$(docker compose ps --format '{{.Health}}' postgres)" = "healthy" ] && break
            sleep 3
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install
        working-directory: worker
        run: python -m pip install -e ".[dev]"
      - name: Tests
        working-directory: worker
        run: python -m pytest -q
      - name: Audit dependencies
        working-directory: worker
        run: python -m pip_audit --skip-editable

  e2e:
    name: Browser end-to-end
    # Needs a Clerk development instance; runs only when its keys are configured as secrets.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    needs: [web, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d && sleep 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install worker
        working-directory: worker
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
          cp .env.example .env
      - name: Install web
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cp .env.example .env
          cp .env.example .env.local
          npm run db:migrate
      - name: End-to-end tests
        working-directory: web
        run: npm run e2e
